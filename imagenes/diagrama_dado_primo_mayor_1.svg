<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">Combinaciones de un número primo y un número mayor que 1</title>
  <desc id="desc">Diagrama de dos lanzamientos de un dado: el primer resultado pertenece al evento primo G y el segundo al evento mayor que 1 I.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fb; }
      .panel { fill: #ffffff; stroke: #d7dde5; stroke-width: 2; }
      .branch { fill: none; stroke: #52616f; stroke-width: 1.8; stroke-linecap: round; opacity: 0.72; }
      .gNode { fill: #fff3c4; stroke: #b27a00; stroke-width: 2.5; }
      .iNode { fill: #eef6f0; stroke: #618b55; stroke-width: 2.5; }
      .resultBox { fill: #f1f8ff; stroke: #2f5d7c; stroke-width: 2; }
      .title { fill: #1f2933; font-family: Arial, sans-serif; font-size: 25px; font-weight: 700; text-anchor: middle; }
      .subtitle { fill: #52616f; font-family: Arial, sans-serif; font-size: 16px; text-anchor: middle; }
      .label { fill: #1f2933; font-family: Arial, sans-serif; font-size: 21px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #52616f; font-family: Arial, sans-serif; font-size: 16px; text-anchor: middle; dominant-baseline: middle; }
      .outcome { fill: #1f2933; font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .math { fill: #1f2933; font-family: Arial, sans-serif; font-size: 21px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1080" height="620"/>
  <rect class="panel" x="28" y="26" width="1024" height="568" rx="8"/>
  <text class="title" x="540" y="58">Dos lanzamientos del dado: G en t1 e I en t2</text>
  <text class="subtitle" x="540" y="86">G = {2, 3, 5}, números primos; I = {2, 3, 4, 5, 6}, números mayores que 1</text>

  <text class="small" x="185" y="125">Primer lanzamiento</text>
  <text class="math" x="185" y="152">G</text>
  <text class="small" x="470" y="125">Segundo lanzamiento</text>
  <text class="math" x="470" y="152">I</text>
  <text class="small" x="790" y="125">Combinaciones</text>

  <path class="branch" d="M225 230L430 190M225 230L430 250M225 230L430 310M225 230L430 370M225 230L430 430"/>
  <path class="branch" d="M225 310L430 190M225 310L430 250M225 310L430 310M225 310L430 370M225 310L430 430"/>
  <path class="branch" d="M225 390L430 190M225 390L430 250M225 390L430 310M225 390L430 370M225 390L430 430"/>

  <circle class="gNode" cx="185" cy="230" r="38"/><text class="label" x="185" y="231">2</text>
  <circle class="gNode" cx="185" cy="310" r="38"/><text class="label" x="185" y="311">3</text>
  <circle class="gNode" cx="185" cy="390" r="38"/><text class="label" x="185" y="391">5</text>

  <rect class="iNode" x="430" y="164" width="80" height="52" rx="9"/><text class="label" x="470" y="191">2</text>
  <rect class="iNode" x="430" y="224" width="80" height="52" rx="9"/><text class="label" x="470" y="251">3</text>
  <rect class="iNode" x="430" y="284" width="80" height="52" rx="9"/><text class="label" x="470" y="311">4</text>
  <rect class="iNode" x="430" y="344" width="80" height="52" rx="9"/><text class="label" x="470" y="371">5</text>
  <rect class="iNode" x="430" y="404" width="80" height="52" rx="9"/><text class="label" x="470" y="431">6</text>

  <rect class="resultBox" x="640" y="155" width="300" height="300" rx="8"/>
  <text class="outcome" x="715" y="195">(2, 2)</text>
  <text class="outcome" x="790" y="195">(2, 3)</text>
  <text class="outcome" x="865" y="195">(2, 4)</text>
  <text class="outcome" x="715" y="245">(2, 5)</text>
  <text class="outcome" x="790" y="245">(2, 6)</text>
  <text class="outcome" x="865" y="245">(3, 2)</text>
  <text class="outcome" x="715" y="295">(3, 3)</text>
  <text class="outcome" x="790" y="295">(3, 4)</text>
  <text class="outcome" x="865" y="295">(3, 5)</text>
  <text class="outcome" x="715" y="345">(3, 6)</text>
  <text class="outcome" x="790" y="345">(5, 2)</text>
  <text class="outcome" x="865" y="345">(5, 3)</text>
  <text class="outcome" x="715" y="395">(5, 4)</text>
  <text class="outcome" x="790" y="395">(5, 5)</text>
  <text class="outcome" x="865" y="395">(5, 6)</text>

  <text class="math" x="540" y="525">n(G x I) = n(G) x n(I) = 3 x 5 = 15</text>
</svg>
