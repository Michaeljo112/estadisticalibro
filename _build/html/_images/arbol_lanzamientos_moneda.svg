<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780" role="img" aria-labelledby="title desc">
  <title id="title">Árbol de bifurcación para cuatro lanzamientos de una moneda</title>
  <desc id="desc">Diagrama que muestra los dieciséis resultados posibles de cuatro lanzamientos de una moneda.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fb; }
      .panel { fill: #ffffff; stroke: #d7dde5; stroke-width: 2; }
      .branch { fill: none; stroke: #52616f; stroke-width: 2.2; stroke-linecap: round; }
      .resultLine { stroke: #8ab17d; stroke-width: 1.8; stroke-linecap: round; }
      .node { fill: #ffffff; stroke: #2f5d7c; stroke-width: 3; }
      .coin { fill: #fff3c4; stroke: #b27a00; stroke-width: 2.3; }
      .leaf { fill: #f1f8ff; stroke: #2f5d7c; stroke-width: 2; }
      .resultBox { fill: #eef6f0; stroke: #8ab17d; stroke-width: 1.6; }
      .startLabel { fill: #1f2933; font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .label { fill: #1f2933; font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .leafLabel { fill: #1f2933; font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #52616f; font-family: Arial, sans-serif; font-size: 16px; text-anchor: middle; dominant-baseline: middle; }
      .outcome { fill: #1f2933; font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .title { fill: #1f2933; font-family: Arial, sans-serif; font-size: 25px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

